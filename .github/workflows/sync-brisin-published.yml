name: Sincronizar Brisin publicado
on:
  push:
    branches: [codex/sync-brisin-20261006]
permissions:
  contents: write
concurrency:
  group: brisin-published-source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir pacote publicado e atualizar web e mobile
        run: python .github/brisin-sync/sync.py
      - name: Remover o fluxo temporário ao terminar
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-brisin-published.yml .github/brisin-sync/sync.py .github/brisin-sync/mobile.json .github/brisin-sync/archive.json
          git commit -m 'Remove sincronização temporária do Brisin'
          git push origin HEAD:refs/heads/codex/sync-brisin-20261006
